  <script>
    // apply saved theme and size before first paint, so the page never flashes
    try { var s = JSON.parse(localStorage.getItem('easynostr.settings') || '{}');
      document.documentElement.dataset.theme = s.theme || 'auto';
      document.documentElement.dataset.size = s.textSize || 'normal'; } catch (e) {}
